user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # ── gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream frontend    { server frontend:3000; }
    upstream backend     { server backend:8000; }
    upstream odk         { server odk-central:8383; }
    upstream superset    { server superset:8088; }
    upstream airflow     { server airflow-webserver:8080; }
    upstream grafana     { server grafana:3000; }
    upstream minio_api   { server minio:9000; }
    upstream minio_ui    { server minio:9001; }
    upstream r_api       { server r-api:8686; }

    server {
        listen 80;
        server_name _;

        # ── Next.js frontend (default) ────────────────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # ── FastAPI backend API ───────────────────────────────────────────
        location /api/ {
            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # ── FastAPI docs ──────────────────────────────────────────────────
        location /docs {
            proxy_pass http://backend/docs;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass http://backend/openapi.json;
        }

        # ── ODK Central ───────────────────────────────────────────────────
        location /odk/ {
            proxy_pass http://odk/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
            client_max_body_size 100M;
        }

        # ── Apache Superset ───────────────────────────────────────────────
        location /superset/ {
            proxy_pass http://superset/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }

        # ── Apache Airflow ────────────────────────────────────────────────
        location /airflow/ {
            proxy_pass http://airflow/airflow/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Grafana ───────────────────────────────────────────────────────
        location /grafana/ {
            proxy_pass http://grafana/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── MinIO API ─────────────────────────────────────────────────────
        location /minio/ {
            proxy_pass http://minio_api/;
            proxy_set_header Host $host;
        }

        # ── MinIO Console ─────────────────────────────────────────────────
        location /minio-ui/ {
            proxy_pass http://minio_ui/;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── R Plumber API ─────────────────────────────────────────────────
        location /r-api/ {
            proxy_pass http://r_api/;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }
    }
}
