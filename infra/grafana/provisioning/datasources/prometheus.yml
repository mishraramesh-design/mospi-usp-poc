apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
  - name: PostgreSQL
    type: postgres
    url: postgres:5432
    database: mospi_usp
    user: appuser
    secureJsonData:
      password: apppassword
    jsonData:
      sslmode: disable
      postgresVersion: 1700
    editable: true
